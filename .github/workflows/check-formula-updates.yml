name: Check for formula updates

on:
  schedule:
    # Daily at 07:00 UTC.
    - cron: "0 7 * * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

# Never let two runs (e.g. a manual dispatch overlapping the schedule) race to
# open the same issue / PR. Queue them instead of running in parallel.
concurrency:
  group: check-formula-updates
  cancel-in-progress: false

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open issues for missing upstream CODEOWNERS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Ensure the label exists (idempotent); ignore "already exists".
          gh label create automated --repo "$REPO" \
            --color ededed --description "Opened by automation" 2>/dev/null || true
          for f in Formula/*.rb; do
            line="$(scripts/check_codeowners.sh "$f")" || {
              echo "::warning::check_codeowners.sh failed for $f; skipping"
              continue
            }
            slug="$(printf '%s' "$line" | cut -f1)"
            status="$(printf '%s' "$line" | cut -f2)"
            top="$(printf '%s' "$line" | cut -f3)"

            [ "$status" = "missing" ] || continue

            title="Add CODEOWNERS to upstream $slug"
            # Idempotent: skip if an issue with this exact title already exists
            # in ANY state. Checking closed issues too means we don't reopen a
            # duplicate after a maintainer has closed it (fixed or declined).
            existing="$(gh issue list --repo "$REPO" --state all \
              --search "in:title $title" --json title \
              --jq "[.[] | select(.title == \"$title\")] | length")"
            if [ "$existing" != "0" ]; then
              echo "Issue already exists for $slug (any state); skipping."
              continue
            fi

            assignee_args=()
            if [ "$top" != "-" ]; then
              assignee_args=(--assignee "$top")
            fi

            body="The upstream repository [\`$slug\`](https://github.com/$slug) — packaged by \`$f\` in this tap — has no \`CODEOWNERS\` file.

          Without one, the automated formula-update workflow can't assign update PRs to the right people. Please add a \`CODEOWNERS\` (in \`.github/\`, the repo root, or \`docs/\`) to the upstream repo.

          Assigned to the current top contributor of \`$slug\`${top:+ (@$top)} as a starting point; reassign as appropriate.

          _Opened automatically by \`.github/workflows/check-formula-updates.yml\`._"

            gh issue create --repo "$REPO" \
              --title "$title" \
              --body "$body" \
              --label automated \
              "${assignee_args[@]}" \
              && echo "Opened CODEOWNERS issue for $slug (assignee: ${top:--none})"
          done

      - name: Check formulae and apply any updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          changed=""
          for f in Formula/*.rb; do
            # Exit 3 = newer release available; --apply rewrites url + sha256.
            if scripts/check_and_update.sh "$f" --apply; then
              :
            else
              status=$?
              if [ "$status" -ne 0 ]; then
                echo "::error::check_and_update.sh failed for $f (exit $status)"
                exit "$status"
              fi
            fi
          done

          if git diff --quiet -- Formula; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "No formula updates found."
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"

            changed_files="$(git diff --name-only -- Formula)"

            # Summarise which formulae changed, for the PR body.
            {
              echo "changed<<EOF"
              echo "$changed_files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

            # Collect the upstream code owners of each changed formula so the
            # PR can be assigned to them. codeowners.sh drops @org/team refs.
            assignees="$(
              while IFS= read -r f; do
                [ -n "$f" ] && scripts/codeowners.sh "$f" 2>/dev/null || true
              done <<< "$changed_files" | sort -u | paste -sd, -
            )"
            echo "assignees=$assignees" >> "$GITHUB_OUTPUT"
            echo "Assignees resolved from upstream CODEOWNERS: ${assignees:-<none>}"
          fi

      - name: Create or update pull request
        if: steps.check.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.ref_name }}
          BRANCH: automated/formula-updates
          ASSIGNEES: ${{ steps.check.outputs.assignees }}
          CHANGED: ${{ steps.check.outputs.changed }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Ensure the PR labels exist (idempotent; ignore "already exists").
          gh label create automated --color ededed \
            --description "Opened by automation" 2>/dev/null || true
          gh label create dependencies --color 0366d6 \
            --description "Dependency updates" 2>/dev/null || true

          # Commit the working-tree changes onto a fixed branch and force-push it.
          # Reusing one branch keeps a single rolling PR instead of stacking new
          # ones each run (mirrors peter-evans/create-pull-request behaviour).
          git switch -C "$BRANCH"
          git add Formula
          git commit -m "Update formulae to latest upstream releases"
          git push --force origin "$BRANCH"

          # Build the PR body. Written line-by-line (not a heredoc) so the YAML
          # block-scalar indentation isn't baked into the rendered markdown.
          {
            echo 'Automated update of formula `url` + `sha256` to the latest upstream'
            echo 'GitHub releases, produced by `scripts/check_and_update.sh --apply`.'
            echo
            echo 'Changed formulae:'
            echo
            echo '```'
            echo "$CHANGED"
            echo '```'
            echo
            echo '> [!IMPORTANT]'
            echo '> Only top-level `url`/`sha256` are updated. Python `resource` blocks'
            echo '> are **not** touched. Before merging, verify upstream dependencies did'
            echo '> not change between releases (see `AGENTS.md`):'
            echo '>'
            echo '> ```sh'
            echo "> gh api repos/<owner>/<repo>/compare/<oldtag>...<newtag> --jq '.files[].filename'"
            echo '> ```'
          } > /tmp/pr-body.md

          # Create the PR only if one isn't already open for this branch; if it
          # exists the force-push above already refreshed it.
          if gh pr list --head "$BRANCH" --state open --json number \
              --jq 'length' | grep -qx 0; then
            assignee_args=()
            if [ -n "$ASSIGNEES" ]; then
              assignee_args=(--assignee "$ASSIGNEES")
            fi
            gh pr create \
              --base "$BASE" \
              --head "$BRANCH" \
              --title "Update formulae to latest upstream releases" \
              --body-file /tmp/pr-body.md \
              --label automated \
              --label dependencies \
              "${assignee_args[@]}"
            echo "Opened PR for $BRANCH (assignees: ${ASSIGNEES:-none})"
          else
            echo "PR already open for $BRANCH; force-push refreshed it."
          fi

